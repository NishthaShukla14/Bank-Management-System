<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Management System - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <style>
        .flash-container { width: 100%; margin-bottom: 15px; }
        .flash { padding: 10px; border-radius: 5px; margin-bottom: 10px; text-align: center; font-size: 14px; font-weight: 600; }
        .flash-danger { background-color: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid #ff4757; }
        .flash-success { background-color: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid #2ed573; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <h2>Welcome to SecureBank</h2>
            <p>Please login to your account</p>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-container">
                        {% for category, message in messages %}
                            <div class="flash flash-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            
            <form action="/" method="POST">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" id="email" placeholder="Enter your email" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="login-btn">Secure Login</button>
            </form>
            
            <p class="signup-link">Don't have an account? <a href="/signup">Open Account</a></p>
        </div>
    </div>

</body>
</html>
